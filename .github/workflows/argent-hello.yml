name: Argent hello comment

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: PR or issue number
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Download argent-cloud
        run: |
          curl -sSfL -o argent-cloud https://github.com/software-mansion-labs/argent-cloud-releases/releases/download/202610231011/argent-cloud
          chmod +x argent-cloud

      - name: Post comment
        env:
          SIM_ROUTER_API_KEY: ${{ secrets.SIM_ROUTER_API_KEY }}
          ARGENT_BACKEND_IP: ${{ secrets.ARGENT_BACKEND_IP }}
        shell: bash
        run: |
          ARGENT_GITHUB_OIDC_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=argent" | jq -r .value)
          echo "::add-mask::$ARGENT_GITHUB_OIDC_TOKEN"
          # Tamper with the signature; this should fail
          # ARGENT_GITHUB_OIDC_TOKEN="${ARGENT_GITHUB_OIDC_TOKEN%.*}.$(tr 'A-Za-z' 'B-ZAb-za' <<< "${ARGENT_GITHUB_OIDC_TOKEN##*.}")"
          export ARGENT_GITHUB_OIDC_TOKEN
          ./argent-cloud comment --comment "Hello world" "${{ github.repository }}#${{ github.event.pull_request.number || inputs.pr }}"
          # ./argent-cloud comment --comment "Hello world" "JBRS307/aaaa#${{ github.event.pull_request.number || inputs.pr }}"
